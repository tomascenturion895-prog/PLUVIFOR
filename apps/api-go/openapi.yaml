openapi: 3.0.3
info:
  title: PLUVIFOR · API
  version: 0.1.0
  description: |
    Contrato de la API. **PROTOTIPO · AI LAB Misión: Código Formosa · no es una herramienta oficial.**

    - La API en Go implementa `GET /health`. Las rutas de estaciones y de la serie diaria
      (`/api/stations`, `/api/stations/{station_id}`, `/api/rainfall`) **ya están escritas y probadas
      en Go** (`x-implemented-in: go`), con las mismas respuestas que Python para los mismos datos
      (pruebas de paridad en `testdata/parity`). Las atiende Go leyendo la base en solo lectura cuando
      se compila con el driver de SQLite; sin driver, las reenvía a Python con el mismo contrato.
    - Las demás rutas de `/api` (comparador, acumulados, informes, importación, lecturas de sensores simuladas) siguen en Python.
    - Un hueco no es 0 mm: en la serie, un día sin dato lleva `state` = `sin_fila` o `fila_sin_valor`
      y `mm` = `null`, nunca 0.
    - Observado, referencia y estimado van separados (`category`) y nunca se suman.
    - Fecha de corte de los datos: 2026-10-31.
    - Todos los errores tienen la misma forma y mensajes en español, sin detalles internos.
servers:
  - url: http://localhost:8080
    description: API en Go (desarrollo)
  - url: http://localhost:8000
    description: API en Python (implementación de referencia de las rutas /api)
paths:
  /health:
    get:
      summary: Estado del servicio
      x-implemented-in: go
      responses:
        '200':
          description: El servicio responde.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /api/stations:
    get:
      summary: Catálogo de estaciones
      x-implemented-in: go
      parameters:
        - { name: source, in: query, schema: { type: string, maxLength: 64 }, description: Código de la fuente }
        - { name: network, in: query, schema: { type: string, maxLength: 100 } }
        - { name: department, in: query, schema: { type: string, maxLength: 100 } }
        - { name: zone, in: query, schema: { type: string, maxLength: 100 } }
        - { name: coords_status, in: query, schema: { $ref: '#/components/schemas/CoordsStatus' } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 }, description: Texto en nombre o localidad }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Página de estaciones.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StationList' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/stations/{station_id}:
    get:
      summary: Ficha de una estación
      x-implemented-in: go
      parameters:
        - { name: station_id, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      responses:
        '200':
          description: La estación.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Station' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/events:
    get:
      summary: Días de lluvia intensa (50 y 100 mm) y rachas secas, de forma descriptiva (SCRUM-63)
      description: |
        Cuenta lo que pasó; no predice ni es una alerta de riesgo. Se indica `station_id` o `zone`,
        pero no los dos. `days_50mm_or_more` incluye los días de 100 mm o más, que figuran también
        en `days_100mm_or_more`. **Un día sin dato no es un día seco:** corta la racha seca y no la
        extiende. Una racha que toca la advertencia de ceros prolongados viene con
        `zero_run_warning: true` y no se da por buena. `min_dry_days` (valor provisional, 7) solo
        filtra la lista; `longest_dry_streak` se informa siempre. Implementada solo en Go: sin el
        driver de SQLite responde 404 por el reenvío a Python.
      x-implemented-in: go
      parameters:
        - { name: station_id, in: query, schema: { $ref: '#/components/schemas/Id' } }
        - { name: zone, in: query, schema: { type: string, maxLength: 100 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: category, in: query, schema: { type: string, enum: [observado, referencia, estimado], default: observado } }
        - { name: min_dry_days, in: query, schema: { type: integer, minimum: 1, maximum: 3660, default: 7 } }
      responses:
        '200':
          description: Una entrada por estación analizada (hasta 100 si se pide por zona).
          content:
            application/json:
              schema:
                type: object
                required: [category, date_from, date_to, data_cutoff_date, clipped_to_cutoff, min_dry_days, stations, notice, description]
                properties:
                  category: { type: string }
                  date_from: { type: string, format: date }
                  date_to: { type: string, format: date }
                  data_cutoff_date: { type: string, format: date }
                  clipped_to_cutoff: { type: boolean }
                  min_dry_days: { type: integer }
                  notice: { type: string }
                  description: { type: string }
                  stations:
                    type: array
                    items:
                      type: object
                      properties:
                        station_id: { type: integer }
                        station_name: { type: string }
                        summary: { type: object }
                        days_50mm_or_more:
                          type: array
                          items: { type: object, properties: { obs_date: { type: string, format: date }, mm: { type: number } } }
                        days_100mm_or_more:
                          type: array
                          items: { type: object, properties: { obs_date: { type: string, format: date }, mm: { type: number } } }
                        dry_streaks:
                          type: array
                          items:
                            type: object
                            properties:
                              start_date: { type: string, format: date }
                              end_date: { type: string, format: date }
                              days: { type: integer }
                              zero_run_warning: { type: boolean }
                        longest_dry_streak: { type: object, nullable: true }
                        warnings: { type: array, items: { type: object } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/rainfall:
    get:
      summary: Serie diaria de una estación con cobertura y advertencias
      x-implemented-in: go
      parameters:
        - { name: station_id, in: query, required: true, schema: { $ref: '#/components/schemas/Id' } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: category, in: query, schema: { $ref: '#/components/schemas/Category' } }
      responses:
        '200':
          description: La serie. Los días sin dato no llevan milímetros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Series' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/field-reports:
    post:
      summary: Cargar un reporte de lluvia de campo (policial), observado y sin validar
      x-implemented-in: python
      responses:
        '201':
          description: El reporte guardado, con su fuente y su ubicación (o pendiente).
          content:
            application/json:
              schema: { type: object }
        '401': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/sensor-readings:
    post:
      summary: Un dispositivo envía una lectura (hoy entra siempre como simulada)
      description: |
        Contrato de ingesta para sensores (SCRUM-94). **No hay sensores reales:** toda lectura se guarda
        con la categoría `simulado`, que no se puede elegir desde el cuerpo, y nunca se suma a las series
        de las estaciones. `read_at` lleva zona horaria; no se acepta una lectura posterior al corte.
        `mm` es obligatorio: una lectura que no llegó no se envía (no se manda ni 0 ni vacío).
        Reenviar la misma lectura (mismo `device_id` y misma hora) no la duplica; con otro valor, es un conflicto.
        Python es el único que escribe en la base: Go reenvía este pedido con su encabezado de clave.
      x-implemented-in: python
      security:
        - deviceKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensorReadingIn' }
      responses:
        '201':
          description: La lectura quedó guardada como simulada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorReading' }
        '200':
          description: La lectura ya estaba cargada con el mismo valor; no se duplica.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SensorReading' }
        '401': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
    get:
      summary: Últimas lecturas de sensores, rotuladas como simuladas
      x-implemented-in: python
      parameters:
        - { name: device_id, in: query, schema: { type: string, maxLength: 64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Lecturas más nuevas primero, con el aviso de que son simuladas.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, notice]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/SensorReading' } }
                  total: { type: integer }
                  notice: { type: string }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/sensor-readings/devices:
    get:
      summary: Dispositivos que enviaron lecturas, con su última lectura (siempre simulados)
      description: |
        Una fila por dispositivo: cuántas lecturas tiene, la primera, la última y los milímetros de
        la última (puede ser un 0 real). Un dispositivo que nunca envió nada no aparece: no se inventa.
        Cada uno trae su estado, calculado contra la fecha de corte de los datos (no contra hoy) con la
        misma regla que las estaciones: `en_silencio` si su última lectura es de hace más de
        `silent_after_days` días. Un silencio no es 0 mm: sigue mostrando su última lectura real.
      x-implemented-in: python
      parameters:
        - { name: silent_after_days, in: query, schema: { type: integer, minimum: 1, maximum: 365, default: 30 } }
      responses:
        '200':
          description: Dispositivos ordenados por nombre, con el aviso de que son simulados.
          content:
            application/json:
              schema:
                type: object
                required: [items, total, notice, data_cutoff_date, silent_after_days, active, silent]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [device_id, readings, first_read_at, last_read_at, last_mm, category, state, last_read_date, days_since_last]
                      properties:
                        device_id: { type: string }
                        readings: { type: integer }
                        first_read_at: { type: string, format: date-time }
                        last_read_at: { type: string, format: date-time }
                        last_mm: { type: number }
                        category: { type: string, enum: [simulado] }
                        state: { type: string, enum: [activa, en_silencio] }
                        last_read_date: { type: string, format: date }
                        days_since_last: { type: integer }
                  total: { type: integer }
                  notice: { type: string }
                  data_cutoff_date: { type: string, format: date }
                  silent_after_days: { type: integer }
                  active: { type: integer }
                  silent: { type: integer }
  /api/alerts/subscriptions:
    post:
      summary: Pedir avisos de lluvia; se manda un código de confirmación por un canal simulado
      description: |
        Prototipo (ver docs/ingesta-avisos.md). **No se envía nada real:** el código queda en una bandeja
        rotulada como simulada. La respuesta es siempre la misma exista o no el número, y nunca trae el
        código. Sin `ALERTS_SECRET` configurada, las suscripciones están cerradas (403).
      x-implemented-in: python
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              additionalProperties: false
              properties:
                phone: { type: string, description: 'De 8 a 15 dígitos; puede llevar + y espacios.' }
                email: { type: string, nullable: true, description: 'Opcional. Si lo deja, también recibe el registro y los avisos por correo (simulado). Se guarda solo enmascarado.' }
                station_id: { type: integer, minimum: 1, nullable: true }
      responses:
        '202': { description: Quedó pendiente de confirmar. }
        '403': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/alerts/subscriptions/confirm:
    post:
      summary: Confirmar la suscripción con el código de 6 dígitos
      description: Vence a los 15 minutos y se bloquea tras 5 intentos fallidos (429).
      x-implemented-in: python
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              additionalProperties: false
              properties:
                phone: { type: string }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        '200': { description: Suscripción confirmada. }
        '422': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/Invalid' }
  /api/alerts/subscriptions/unsubscribe:
    post:
      summary: Darse de baja; responde igual exista o no el número
      x-implemented-in: python
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              additionalProperties: false
              properties:
                phone: { type: string }
      responses:
        '200': { description: El número queda dado de baja. }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/alerts/inbox:
    post:
      summary: Demostración, lo que la persona vería en su celular y su correo (simulados)
      description: |
        Solo con `ALERTS_DEMO` activado; apagado por defecto responde 403. Con canales reales, nadie
        puede leer los mensajes de otra persona, por eso esta ruta existe únicamente para presentar el
        prototipo. Devuelve los mensajes de ese teléfono con su canal (`whatsapp`, `email` o `sistema`),
        el destinatario enmascarado y, en los correos, el asunto. Un número desconocido responde una
        lista vacía: no se revela si existe.
      x-implemented-in: python
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              additionalProperties: false
              properties:
                phone: { type: string }
      responses:
        '200': { description: Los mensajes simulados de esa persona, más viejos primero. }
        '403': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/alerts/preview:
    get:
      summary: Vista previa del aviso de una estación y un día (clave de administración)
      description: |
        Solo un día observado con dato y con 50 mm o más genera aviso. Un hueco (`sin_fila` o
        `fila_sin_valor`) responde `sin_dato` y nunca se cuenta como 0 mm. No se acepta un día posterior
        al corte de datos. El mensaje no ordena evacuar y remite a Defensa Civil.
      x-implemented-in: python
      security:
        - adminKey: []
      parameters:
        - { name: station_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: El aviso que se armaría, o el motivo por el que no se envía. }
        '401': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/alerts/send:
    post:
      summary: Poner el aviso en la bandeja simulada de las suscripciones confirmadas (clave de administración)
      description: Un revisor del equipo lo confirma llamando a esta ruta. No sale ningún mensaje real.
      x-implemented-in: python
      security:
        - adminKey: []
      parameters:
        - { name: station_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: date, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200': { description: Cuántos mensajes quedaron en la bandeja simulada. }
        '401': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/alerts/outbox:
    get:
      summary: Mensajes que se enviarían, siempre simulados (clave de administración)
      x-implemented-in: python
      security:
        - adminKey: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Más nuevos primero, con el aviso de que el canal es simulado. }
        '401': { $ref: '#/components/responses/Invalid' }
  /api/recurrence:
    get:
      summary: Cada cuánto llovió 50 y 100 mm o más en una estación (histórico, no es predicción)
      description: |
        Frecuencia **pasada** de días de lluvia intensa, calculada solo con la serie `observado`. No proyecta
        hacia adelante ni es una alerta. Un hueco (`sin_fila` o `fila_sin_valor`) no cuenta como lluvia ni
        como día seco. Los días con dato dentro de una racha de ceros prolongados se excluyen (pueden ser
        falsos ceros). Con menos de 5 años de dato válido no se informa ninguna frecuencia
        (`sufficient_history: false`). Los períodos de más de 3.660 días se piden por tramos (tope: 4 tramos).
      x-implemented-in: python
      parameters:
        - { name: station_id, in: query, required: true, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Conteo y frecuencia pasada, con el detalle por año.
          content:
            application/json:
              schema:
                type: object
                required: [station_id, station_name, category, date_from, date_to, valid_days, observed_years, excluded_zero_run_days, gap_days, sufficient_history, min_observed_years, ge50, ge100, by_year, notice]
                properties:
                  station_id: { type: integer }
                  station_name: { type: string }
                  category: { type: string, enum: [observado] }
                  date_from: { type: string, format: date }
                  date_to: { type: string, format: date }
                  clipped_to_cutoff: { type: boolean }
                  valid_days: { type: integer }
                  observed_years: { type: number }
                  excluded_zero_run_days: { type: integer }
                  gap_days: { type: integer }
                  sufficient_history: { type: boolean }
                  min_observed_years: { type: number }
                  ge50: { type: integer }
                  ge100: { type: integer }
                  ge50_per_year: { type: number, nullable: true }
                  ge100_per_year: { type: number, nullable: true }
                  ge50_every_years: { type: number, nullable: true }
                  ge100_every_years: { type: number, nullable: true }
                  by_year:
                    type: array
                    items:
                      type: object
                      required: [year, valid_days, ge50, ge100]
                      properties:
                        year: { type: integer }
                        valid_days: { type: integer }
                        ge50: { type: integer }
                        ge100: { type: integer }
                  notice: { type: string }
        '404': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/auth/register:
    post:
      summary: Crear una cuenta de ciudadano
      description: |
        El rol no se puede elegir: toda cuenta nueva es de ciudadano (un campo `role` se rechaza con 422).
        Contraseña de 10 a 128 caracteres. El correo se guarda en minúsculas y no se repite (409).
        Con `REGISTRATION_OPEN=false` responde 403. La contraseña nunca vuelve en una respuesta.
      x-implemented-in: python
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string }
                password: { type: string, minLength: 10, maxLength: 128 }
                display_name: { type: string, maxLength: 80, nullable: true }
      responses:
        '201': { description: Cuenta creada con rol ciudadano. }
        '403': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/auth/login:
    post:
      summary: Iniciar sesión; devuelve un token de sesión
      description: |
        Un correo inexistente y una clave incorrecta responden lo mismo (401). Tras 5 intentos fallidos la
        cuenta se bloquea 15 minutos (429). El token se envía como `Authorization: Bearer ...`, vence a las
        `SESSION_HOURS` horas y en la base solo queda su resumen.
      x-implemented-in: python
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              additionalProperties: false
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { description: 'Sesión iniciada: token, vencimiento y la cuenta.' }
        '401': { $ref: '#/components/responses/Invalid' }
        '429': { $ref: '#/components/responses/Invalid' }
  /api/auth/logout:
    post:
      summary: Cerrar la sesión actual (revoca el token)
      x-implemented-in: python
      security:
        - sessionToken: []
      responses:
        '204': { description: Sesión cerrada (también sin sesión). }
  /api/auth/me:
    get:
      summary: La cuenta de la sesión actual
      x-implemented-in: python
      security:
        - sessionToken: []
      responses:
        '200': { description: La cuenta. }
        '401': { $ref: '#/components/responses/Invalid' }
  /api/users:
    get:
      summary: Cuentas (solo administradores con sesión)
      description: La clave de administración no alcanza para gestionar cuentas.
      x-implemented-in: python
      security:
        - sessionToken: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200': { description: Las cuentas, sin contraseñas. }
        '401': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Invalid' }
  /api/users/{user_id}:
    patch:
      summary: Cambiar el rol o activar o desactivar una cuenta (solo administradores)
      description: |
        Solo se puede cambiar `role` y `is_active`. Cambiar el rol o desactivar cierra las sesiones de esa
        cuenta. Nadie puede cambiarse a sí mismo (409), así siempre queda un administrador.
      x-implemented-in: python
      security:
        - sessionToken: []
      parameters:
        - { name: user_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                role: { type: string, enum: [ciudadano, operador, administrador] }
                is_active: { type: boolean }
      responses:
        '200': { description: La cuenta actualizada. }
        '401': { $ref: '#/components/responses/Invalid' }
        '403': { $ref: '#/components/responses/Invalid' }
        '404': { $ref: '#/components/responses/Invalid' }
        '409': { $ref: '#/components/responses/Invalid' }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/estimates:
    get:
      summary: Valores ESTIMADOS para días sin dato (SCRUM-93), siempre aparte de lo observado
      description: |
        Cada ítem rellena un día que en la serie observada sigue siendo `sin_fila` o `fila_sin_valor`:
        la estimación no cambia ese estado ni entra en ningún acumulado. La categoría es siempre
        `estimado`. `method` y `detail` dicen cómo se calculó y con qué estaciones vecinas.
        Solo se usan vecinas con coordenadas verificadas, del mismo tipo y con el mismo corte del día.
        Los parámetros del método son una propuesta, todavía sin validar.
      x-implemented-in: python
      parameters:
        - { name: station_id, in: query, schema: { type: integer, minimum: 1 } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 200 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: Estimaciones por fecha, con el aviso de que no son datos medidos.
          content:
            application/json:
              schema:
                type: object
                required: [category, notice, items, total, limit, offset]
                properties:
                  category: { type: string, enum: [estimado] }
                  notice: { type: string }
                  items:
                    type: array
                    items:
                      type: object
                      required: [station_id, obs_date, mm, category, gap_state, method, detail, created_at]
                      properties:
                        station_id: { type: integer }
                        obs_date: { type: string, format: date }
                        mm: { type: number, minimum: 0 }
                        category: { type: string, enum: [estimado] }
                        gap_state: { type: string, enum: [sin_fila, fila_sin_valor] }
                        method: { type: string, example: vecinas_idw_v1 }
                        detail: { type: object }
                        created_at: { type: string, format: date-time }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        '422': { $ref: '#/components/responses/Invalid' }
  /api/network/health:
    get:
      summary: Salud de la red, estaciones activas, en silencio y sin datos
      x-implemented-in: python
      parameters:
        - { name: silent_after_days, in: query, description: 'Días sin lectura (antes del corte) para marcar en silencio; por defecto 30', schema: { type: integer, minimum: 1, maximum: 365 } }
      responses:
        '200':
          description: Una fila por estación con su última lectura con valor. Un silencio no lleva 0 mm.
          content:
            application/json:
              schema: { type: object }
        '422': { $ref: '#/components/responses/Invalid' }
components:
  securitySchemes:
    sessionToken:
      type: http
      scheme: bearer
      description: Token de sesión de POST /api/auth/login. Las rutas de escritura aceptan también la clave de administración.
    adminKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clave de administración, tomada de ADMIN_API_KEY. Sin ella la escritura queda cerrada.
    deviceKey:
      type: apiKey
      in: header
      name: X-Device-Key
      description: Clave de los dispositivos, tomada de la variable de entorno DEVICE_API_KEY. Sin ella la ingesta queda cerrada.
  responses:
    NotFound:
      description: No existe lo que se pidió.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Invalid:
      description: Parámetros inválidos.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    SensorCategory: { type: string, enum: [simulado], description: Hoy no hay hardware real; no se acepta otra categoría. }
    SensorReadingIn:
      type: object
      additionalProperties: false
      required: [device_id, read_at, mm]
      properties:
        device_id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' }
        read_at: { type: string, format: date-time, description: Con zona horaria (por ejemplo 2026-10-20T07:00:00-03:00) y no posterior al corte. }
        mm: { type: number, minimum: 0, maximum: 1000, description: Milímetros medidos por el dispositivo; un 0 es una medición, un dato que falta no se envía. }
        lat: { type: number, minimum: -90, maximum: 90, description: Solo junto con lon. Si no se informa, queda sin ubicación. }
        lon: { type: number, minimum: -180, maximum: 180 }
    SensorReading:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        device_id: { type: string }
        read_at: { type: string, format: date-time, description: Siempre en UTC. }
        mm: { type: number }
        lat: { type: number, nullable: true }
        lon: { type: number, nullable: true }
        category: { $ref: '#/components/schemas/SensorCategory' }
        source: { type: string, example: sensor_simulado }
        created_at: { type: string, format: date-time }
    Id: { type: integer, minimum: 1, maximum: 2147483647 }
    Category: { type: string, enum: [observado, referencia, estimado] }
    CoordsStatus: { type: string, enum: [verificada, pendiente] }
    RainState: { type: string, enum: [dato, sin_fila, fila_sin_valor] }
    Health:
      type: object
      required: [status, version, env, data_cutoff_date]
      properties:
        status: { type: string, example: ok }
        version: { type: string }
        env: { type: string }
        data_cutoff_date: { type: string, format: date }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: not_found }
            message: { type: string, example: No se encontró lo que pediste. }
            details: { type: array, items: { type: object } }
    Source:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        network: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        day_cutoff_local: { type: string, nullable: true }
    Station:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        code: { type: string }
        internal_code: { type: string, nullable: true }
        name: { type: string }
        kind: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        department: { type: string, nullable: true }
        zone: { type: string, nullable: true }
        lat: { type: number, nullable: true }
        lon: { type: number, nullable: true }
        elevation_m: { type: number, nullable: true }
        coords_status: { $ref: '#/components/schemas/CoordsStatus' }
        active_from: { type: string, format: date, nullable: true }
        active_to: { type: string, format: date, nullable: true }
        source: { $ref: '#/components/schemas/Source' }
    StationList:
      type: object
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Station' } }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Day:
      type: object
      properties:
        obs_date: { type: string, format: date }
        state: { $ref: '#/components/schemas/RainState' }
        mm: { type: number, nullable: true, description: Nulo cuando no hay dato. Nunca 0 por defecto. }
        category: { $ref: '#/components/schemas/Category' }
        source: { type: string }
        flags: { type: array, items: { type: string } }
    Series:
      type: object
      description: Resumen y advertencias se detallan en la API de Python (apps/backend, esquema SeriesOut).
      properties:
        station_id: { $ref: '#/components/schemas/Id' }
        station_name: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        date_from: { type: string, format: date }
        date_to: { type: string, format: date }
        data_cutoff_date: { type: string, format: date }
        clipped_to_cutoff: { type: boolean }
        days: { type: array, items: { $ref: '#/components/schemas/Day' } }
